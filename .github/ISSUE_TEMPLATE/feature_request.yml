name: Feature request
description: Propose a domain-neutral improvement to the public framework.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What public framework gap should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What other approaches did you consider?
    validations:
      required: false
  - type: checkboxes
    id: boundary
    attributes:
      label: Public boundary
      options:
        - label: The proposal can be implemented with synthetic examples and no private vertical assets.
          required: true
